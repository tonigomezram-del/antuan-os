<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:radial-gradient(circle at 30% 20%,#3b2030,#120c10 70%);font-family:Segoe UI,sans-serif}
.g{position:absolute;left:30px;top:30px;display:grid;grid-template-columns:repeat(7,120px);gap:18px}
.i{display:grid;justify-items:center;gap:8px;color:#fff;font-size:14px}
.i b{width:76px;height:76px;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.c{position:absolute;left:330px;top:120px;width:440px;height:290px;border-radius:22px;background:rgba(255,255,255,.015);box-shadow:0 18px 44px -18px rgba(0,0,0,.6),inset 0 1.6px 16px rgba(0,0,0,.09),inset 0 -1.6px 16px rgba(255,255,255,.07)}
.in{position:absolute;inset:0;padding:16px 18px;color:#fff;font:600 16px Segoe UI;border-radius:inherit;clip-path:inset(0 round 22px)}</style></head><body>
<div class="g" id="g"></div>
<div class="c" id="w"><div class="in">TIEMPO<div style="font:200 64px Segoe UI;margin:10px 0">22°</div>Olot · Nublado</div></div>
<script>
const cols=['#ef4444','#f59e0b','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f97316','#14b8a6'];
const n=['Chrome','Steam','Carpetas','Capturas','Roblox','VS Code','Gemini','Edge','VLC','Spotify'];
document.getElementById('g').innerHTML=Array.from({length:28},(_,k)=>`<div class="i"><b style="background:linear-gradient(160deg,${cols[k%10]},#111)"></b>${n[k%10]}</div>`).join('');
</script>
<script src="../UmbraOS/shell/ui/liquid.js"></script>
<script>
window.pinta=(cfg)=>{LiquidGlass.ajustar(LiquidGlass.desdeConfig(cfg));const el=document.getElementById('w');const w=el.offsetWidth,h=el.offsetHeight;el.style.backdropFilter='url(#'+LiquidGlass.filtroFijo(w,h,22,{},'lente')+')';el.querySelector('.in').style.filter='url(#'+LiquidGlass.filtroFijo(w,h,22,{},'contenido')+')';return LiquidGlass.ajustes};
pinta({});
</script></body></html>
