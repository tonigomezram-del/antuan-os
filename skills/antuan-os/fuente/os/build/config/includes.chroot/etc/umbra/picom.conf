# Composicion Antuan: cristal real, esquinas redondeadas, sombras y animaciones suaves
backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 14;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Umbra'", "class_g = 'Antuan'" ];

blur: { method = "dual_kawase"; strength = 7; };
# La capa de Antuan (dock) ocupa toda la pantalla y es transparente: si se desenfocara lo de detras,
# se veria todo borroso. Sus paneles ya llevan su propio cristal.
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Umbra' && window_type = 'normal'", "class_g = 'Antuan' && window_type = 'normal'" ];

shadow = true;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = -22;
shadow-offset-y = -14;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.07;
fade-delta = 6;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.96; };
  popup_menu = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};
