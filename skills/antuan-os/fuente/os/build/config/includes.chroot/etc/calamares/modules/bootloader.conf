# Cargador de arranque: GRUB (UEFI y BIOS)
---
efiBootLoader: "grub"

grubInstall:   "/usr/local/sbin/antuan-grub-install"
grubMkconfig:  "grub-mkconfig"
grubCfg:       "/boot/grub/grub.cfg"
grubProbe:     "grub-probe"
efiBootMgr:    "efibootmgr"

# Nombre de la entrada en el menu de arranque del firmware (y carpeta EFI/Antuan)
efiBootloaderId: "Antuan"

# Copia tambien a EFI/Boot/bootx64.efi para firmwares que olvidan las entradas
installEFIFallback: false
