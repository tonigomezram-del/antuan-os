# Quita del sistema instalado lo que solo sirve en la sesion de prueba
# (lanzador del instalador, bienvenida automatica, regla polkit, configuracion
# de Calamares). Se ejecuta dentro del sistema instalado (chroot).
# El "-" inicial hace que un fallo no detenga la instalacion.
---
dontChroot: false
timeout: 120
script:
    - "-/bin/sh /usr/lib/umbra/instalador/limpieza.sh"

i18n:
    name: "Dejando Antuan listo"
