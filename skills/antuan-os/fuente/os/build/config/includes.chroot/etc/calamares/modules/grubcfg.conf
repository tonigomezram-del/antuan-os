# /etc/default/grub del sistema instalado.
# GRUB_DISTRIBUTOR sale de bootloaderEntryName del branding ("Antuan").
# El resto del aspecto (sin menu, tema y animacion) lo pone /etc/default/grub.d/umbra.cfg
---
overwrite: false
keepDistributor: false
prefer_grub_d: false
always_use_defaults: false

defaults:
    GRUB_TIMEOUT: 0
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
