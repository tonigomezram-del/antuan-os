# Region, zona horaria e idioma
---
# Zona horaria por defecto: Europa/Madrid
region:                      "Europe"
zone:                        "Madrid"

# No cambiar la hora de la sesion de prueba al elegir otra zona
adjustLiveTimezone:          false

# Donde se activan los idiomas (Debian usa /etc/locale.gen)
localeGenPath:               "/etc/locale.gen"

# Sin geolocalizacion por IP (privacidad y funciona sin red)
geoip:
    style:    "none"
    url:      ""
    selector: ""
