# /etc/fstab y /etc/crypttab del sistema instalado
# (las opciones de montaje estan en mount.conf, como pide Calamares 3.3)
---
crypttabOptions: luks

# /tmp en memoria solo en discos SSD
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
