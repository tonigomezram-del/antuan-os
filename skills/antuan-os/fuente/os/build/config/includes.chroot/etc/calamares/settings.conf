# Instalador Antuan (Calamares 3.3)
# Secuencia de pasos que ve el usuario (show) y trabajos que se ejecutan (exec).
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Instancias propias: scripts de Antuan ejecutados con el modulo shellprocess
instances:
- id:     arranque
  module: shellprocess
  config: shellprocess-arranque.conf
- id:     limpieza
  module: shellprocess
  config: shellprocess-limpieza.conf

sequence:
- show:
  - welcome
  - license
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  # Prepara el arranque (nucleo en /boot, GRUB sin red); sustituye a
  # "bootloader-config" de calamares-settings-debian, que necesita apt con red.
  - shellprocess@arranque
  - grubcfg
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - removeuser
  # Quita del sistema instalado todo lo que solo tiene sentido en la sesion de prueba
  - shellprocess@limpieza
  - umount
- show:
  - finished

branding: umbra

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
