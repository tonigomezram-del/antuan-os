# Cuenta de usuario del sistema instalado
---
# Grupos del primer usuario (se crean si no existen). "sudo" lo hace administrador.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - lpadmin
    - bluetooth
    - scanner
    - render
    - input

# Inicio de sesion automatico: casilla opcional, desmarcada por defecto
autoLoginGroup:           autologin
doAutologin:              false

# Sin contrasena de root separada: el usuario administra con sudo
setRootPassword:          false
doReusePassword:          true

# Contrasenas: se avisa si es debil, pero se permite
passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1
allowWeakPasswords:        true
allowWeakPasswordsDefault: false

userShell:                /bin/bash

# Nombre del equipo por defecto: "antuan"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "antuan"
    forbidden_names: [ localhost ]

# Nombres de usuario reservados. "umbra" es el usuario de la sesion de prueba:
# el modulo removeuser lo borra al final, asi que no puede usarse aqui.
forbiddenLoginNames: [ root, umbra ]
