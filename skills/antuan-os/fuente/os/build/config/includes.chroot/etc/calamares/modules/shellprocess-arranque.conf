# Prepara el arranque del sistema instalado sin necesitar red:
# comprueba que el nucleo esta en /boot y que GRUB (UEFI y BIOS) esta disponible.
# Se ejecuta desde la sesion de prueba (dontChroot) para poder leer el pendrive.
---
dontChroot: true
timeout: 600
script:
    - command: "/usr/lib/umbra/instalador/preparar-arranque.sh ${ROOT}"
      timeout: 600

i18n:
    name: "Preparando el arranque de Antuan"
