# Paquetes: quita del sistema instalado lo que solo sirve en la sesion de prueba.
# try_remove: si alguno no esta instalado, no se detiene la instalacion.
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false

operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-boot-initramfs-tools
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
      - calamares-settings-debian
