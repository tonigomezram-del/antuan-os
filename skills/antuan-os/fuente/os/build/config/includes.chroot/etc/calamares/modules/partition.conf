# Discos y particiones
# Opciones que ve el usuario: borrar disco, instalar junto a otro sistema,
# reemplazar una particion o particionado manual; cifrado opcional.
---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     300MiB
    label:           "EFI"

# Intercambio: Antuan usa siempre ZRAM (memoria comprimida, zram-tools).
# Ademas se puede pedir un archivo de intercambio en disco.
#   none = solo ZRAM      file = ZRAM + archivo de intercambio
userSwapChoices:
    - none
    - file
initialSwapChoice: none

# Avisa si /boot queda sin cifrar en un particionado manual cifrado
showNotEncryptedBootMessage: true

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning:   true

# Ninguna opcion marcada al entrar: el usuario elige
initialPartitioningChoice: none

# Sistema de archivos por defecto ext4, con btrfs como alternativa
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4", "btrfs"]

# Casilla "Cifrar el sistema" en el particionado automatico.
# luks1 para que GRUB pueda abrir /boot dentro del volumen cifrado.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

# Tabla de particiones en discos nuevos: sin fijar, Calamares usa GPT en
# UEFI y MBR (msdos) en BIOS antigua, que es lo que GRUB necesita.
