# Pantalla de bienvenida del Instalador Antuan
---
# Sin enlaces externos (ni soporte, ni notas de version, ni donaciones)
showSupportUrl:       false
showKnownIssuesUrl:   false
showReleaseNotesUrl:  false
showDonateUrl:        false

requirements:
    # Espacio minimo en disco (GiB)
    requiredStorage:    25
    # Memoria recomendada (GiB): solo avisa, no impide instalar
    requiredRam:        4.0
    # Comprobacion de internet (opcional, solo informativa)
    internetCheckUrl:   http://detectportal.firefox.com/success.txt

    # Lo que se comprueba...
    check:
      - storage
      - ram
      - power
      - internet
      - root
      - screen
    # ...y lo que es obligatorio para continuar
    required:
      - storage
      - root

# Sin geolocalizacion por IP: el idioma por defecto es el de la sesion (es_ES)
geoip:
    style:    "none"
    url:      ""
    selector: ""
