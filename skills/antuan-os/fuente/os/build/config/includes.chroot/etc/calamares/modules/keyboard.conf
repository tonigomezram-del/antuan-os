# Teclado. La distribucion por defecto es la de la sesion de prueba, que ya
# arranca en espanol (keyboard-layouts=es en el arranque y setxkbmap es).
---
xOrgConfFileName:      "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath:   "/lib/kbd/keymaps/xkb"
# Debian guarda el teclado en /etc/default/keyboard
writeEtcDefaultKeyboard: true
