# Gestor de inicio de sesion: LightDM con la sesion Antuan
---
displaymanagers:
  - lightdm

# Sesion por defecto (y la del inicio automatico si se marca)
defaultDesktopEnvironment:
    executable: "umbra-session"
    desktopFile: "umbra"

basicSetup: false
sysconfigSetup: false

# Pantalla de inicio Antuan (web-greeter) si esta instalada; si no, la de GTK
lightdm:
    preferred_greeters: [ "web-greeter.desktop", "lightdm-gtk-greeter.desktop" ]
